# Argo CD Application: Argo CD itself installs the kube-prometheus-stack Helm chart.
# Apply with: kubectl apply -f kube-prometheus-stack-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.15.0
    helm:
      valuesObject:
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.localhost
        # k3d nodes are Docker containers: the host root fs mount fails there
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
        # k3s embeds these components in one process; they aren't scrapeable separately
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # the Prometheus Operator CRDs are too big for client-side apply annotations
      - ServerSideApply=true
