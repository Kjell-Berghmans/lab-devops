# Helm values for the argo/argocd-apps chart: one entry per Argo CD Application
applications:
  kube-prometheus-stack:
    namespace: argocd
    # No resources-finalizer: on `terraform destroy` Helm would remove Argo CD before
    # it could clean up, leaving the Application stuck. Delete the cluster instead.
    project: default
    source:
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.15.0
      helm:
        valuesObject:
          grafana:
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - grafana.localhost
          # k3d nodes are Docker containers: the host root fs mount fails there
          prometheus-node-exporter:
            hostRootFsMount:
              enabled: false
          # k3s embeds these components in one process; they aren't scrapeable separately
          kubeEtcd:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeProxy:
            enabled: false
    destination:
      server: https://kubernetes.default.svc
      namespace: monitoring
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        # the Prometheus Operator CRDs are too big for client-side apply annotations
        - ServerSideApply=true

  # Step 5: our own API, Helm chart read from the lab's GitHub repo
  hello-api:
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/Kjell-Berghmans/lab-devops.git
      targetRevision: main
      path: 05-api/chart/hello-api
    destination:
      server: https://kubernetes.default.svc
      namespace: hello-api
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
